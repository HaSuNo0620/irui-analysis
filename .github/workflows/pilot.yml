name: Irui pilot analysis

on:
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-ruri-v3-130m

      - name: Restore selected corpus cache
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: data/pilot_candidates.jsonl
          key: irui-corpus-syosetu711k-v2-150k-500-scan60k-seed42-secondary-excluded

      - name: Restore semantic embedding cache
        id: semantic-cache
        uses: actions/cache@v4
        with:
          path: |
            results/candidates.csv
            results/chunk_manifest.csv
            results/embeddings.npy
            results/embeddings_raw.npy
            results/embeddings_anonymized.npy
          key: irui-semantic-${{ runner.os }}-syosetu-v2-ruri130m-${{ hashFiles('run_all.py', 'event_windows.py', 'config.yaml') }}

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Hugging Face token
        if: steps.corpus-cache.outputs.cache-hit != 'true' || steps.semantic-cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN repository secret is missing."
            exit 2
          fi

      - name: Stream work-level Syosetu711K candidates
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          python fetch_hf_candidates.py \
            --repo botp/RyokoAI_Syosetu711K \
            --max-rows 150000 \
            --max-candidates 500 \
            --scan-chars 60000 \
            --output data/pilot_candidates.jsonl

      - name: Embed full novel bodies
        if: steps.semantic-cache.outputs.cache-hit != 'true'
        run: |
          python run_all.py \
            --input 'data/pilot_candidates.jsonl' \
            --device cpu

      - name: Diagnose HDBSCAN stability
        run: python diagnose_clusters.py

      - name: Analyze chunk-level semantic structure
        run: |
          python analyze_structure.py \
            --input data/pilot_candidates.jsonl

      - name: Analyze work-level semantic spaces
        run: python analyze_work_space.py

      - name: Write run manifest
        if: always()
        run: |
          mkdir -p results
          {
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "date=$(date -u +%FT%TZ)"
            echo "source=botp/RyokoAI_Syosetu711K"
            echo "sampling_unit=novel"
            echo "corpus_cache_hit=${{ steps.corpus-cache.outputs.cache-hit }}"
            echo "semantic_cache_hit=${{ steps.semantic-cache.outputs.cache-hit }}"
          } > results/run_manifest.txt

      - name: Upload analysis results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irui-pilot-results
          path: results/
          if-no-files-found: warn
          retention-days: 30
